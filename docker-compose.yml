services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25.3-alpine
    container_name: catalog-enrichment-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - catalog-network

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: catalog-enrichment-backend
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_BASE_URL=${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - HF_TOKEN=${HF_TOKEN}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - MILVUS_HOST=${MILVUS_HOST:-milvus-standalone}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
      - TRACING_ENABLED=${TRACING_ENABLED:-false}
      - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      - PHOENIX_PROJECT_NAME=${PHOENIX_PROJECT_NAME:-catalog-enrichment}
    volumes:
      - ./data/outputs:/app/data/outputs
      - ./data/policies:/app/data/policies
      - ./shared/config:/app/shared/config:ro
    depends_on:
      - vlm-nim
      - llm-nim
      - flux-nim
      - trellis-nim
    restart: unless-stopped
    networks:
      - catalog-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend UI Service
  frontend:
    build:
      context: ./src/ui
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=/api
    container_name: catalog-enrichment-frontend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - catalog-network

  # Arize Phoenix - OpenTelemetry trace collector and UI for LLM observability.
  # Optional: the backend exports traces only when TRACING_ENABLED=true, and it
  # deliberately does not depend_on this service so tracing can never delay or
  # block API startup.
  phoenix:
    image: arizephoenix/phoenix:version-20.5.0
    container_name: catalog-enrichment-phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      # Auth defaults ON. Traces carry full prompts and completions, so an
      # instance reachable beyond localhost -- a tunnel, a LAN, a cloud host --
      # must not be readable and writable by anyone holding the URL.
      #
      # PHOENIX_SECRET has no default on purpose. Left unset, only this
      # container fails to start, and Phoenix's own log says why; a `:?`
      # default would instead abort every compose command, so `docker compose
      # up backend` would break for anyone who never wanted tracing.
      # Generate one with: openssl rand -hex 32
      - PHOENIX_ENABLE_AUTH=${PHOENIX_ENABLE_AUTH:-true}
      - PHOENIX_SECRET=${PHOENIX_SECRET:-}
    volumes:
      - phoenix-data:/mnt/data
    restart: unless-stopped
    networks:
      - catalog-network

  # VLM Model
  vlm-nim:
    image: nvcr.io/nim/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:1.7.0-variant
    container_name: nim-vlm
    ports:
      - "8001:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ${LOCAL_NIM_CACHE:-~/.cache/nim}:/opt/nim/.cache
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: "no"
    stdin_open: true
    tty: true
    networks:
      - catalog-network

  # LLM Model
  llm-nim:
    image: nvcr.io/nim/nvidia/nemotron-3.5-lightning-30b-a3b:2.0.9-variant
    container_name: nim-llm
    ports:
      - "8002:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      # Enables OpenAI-compatible automatic tool calls for NAT agents.
      - NIM_PASSTHROUGH_ARGS=--reasoning-parser nemotron_v3 --enable-auto-tool-choice --tool-call-parser qwen3_coder
      - NIM_MODEL_NAME=nvidia/nemotron-3.5-lightning
      - NIM_SERVED_MODEL_NAME=nvidia/nemotron-3.5-lightning
    volumes:
      - ${LOCAL_NIM_CACHE:-~/.cache/nim}:/opt/nim/.cache
    user: "${UID:-1000}"
    ipc: host
    shm_size: "32gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    restart: "no"
    stdin_open: true
    tty: true
    networks:
      - catalog-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # NVIDIA NIM - Embedding Model
  embedqa:
    image: nvcr.io/nim/nvidia/nv-embedqa-e5-v5:1.6
    container_name: embedqa
    ports:
      - "8005:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ${LOCAL_NIM_CACHE:-~/.cache/nim}:/opt/nim/.cache
    user: "${UID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - catalog-network

  # Trellis Model - 3D Asset Generation
  trellis-nim:
    image: nvcr.io/nim/microsoft/trellis:1.0.1
    container_name: nim-trellis
    ports:
      - "8004:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_MODEL_VARIANT=large:image
      - NIM_ALLOW_UNCHECKED_GENERATION=1
    volumes:
      - ${LOCAL_NIM_CACHE:-~/.cache/nim}:/opt/nim/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    restart: "no"
    stdin_open: true
    tty: true
    networks:
      - catalog-network

  # Flux Model - 2D Image Variation Generation
  flux-nim:
    image: nvcr.io/nim/black-forest-labs/flux.1-kontext-dev:1.0.0
    container_name: nim-flux
    ports:
      - "8003:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - NIM_ALLOW_UNCHECKED_GENERATION=1
    volumes:
      - ${LOCAL_NIM_CACHE:-~/.cache/nim}:/opt/nim/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3']
              capabilities: [gpu]
    restart: "no"
    stdin_open: true
    tty: true
    networks:
      - catalog-network

networks:
  catalog-network:
    external: true
    name: catalog-network

volumes:
  nim-cache:
    driver: local
  phoenix-data:
    driver: local
