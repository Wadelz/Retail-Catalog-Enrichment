services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: catalog-enrichment-backend
    ports:
      - "8000:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_BASE_URL=${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - MILVUS_HOST=${MILVUS_HOST:-milvus-standalone}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
    volumes:
      - ./data/outputs:/app/data/outputs
      - ./data/policies:/app/data/policies
      - ./shared/config:/app/shared/config:ro
    depends_on:
      - llm-nim
      - embedqa
    restart: unless-stopped
    networks:
      - catalog-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # LLM NIM (Nemotron)
  llm-nim:
    image: nvcr.io/nim/nvidia/nemotron-3.5-lightning-30b-a3b:2.0.9-variant
    container_name: nim-llm
    ports:
      - "8002:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      # Enables OpenAI-compatible automatic tool calls for NAT agents.
      - NIM_PASSTHROUGH_ARGS=--reasoning-parser nemotron_v3 --enable-auto-tool-choice --tool-call-parser qwen3_coder
      - NIM_MODEL_NAME=nvidia/nemotron-3.5-lightning
      - NIM_SERVED_MODEL_NAME=nvidia/nemotron-3.5-lightning
    volumes:
      - ${LOCAL_NIM_CACHE:-~/.cache/nim}:/opt/nim/.cache
    user: "${UID:-1000}"
    ipc: host
    shm_size: "32gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    restart: "no"
    stdin_open: true
    tty: true
    networks:
      - catalog-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # NVIDIA NIM - Embedding Model
  embedqa:
    image: nvcr.io/nim/nvidia/nv-embedqa-e5-v5:1.6
    container_name: embedqa
    ports:
      - "8005:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ${LOCAL_NIM_CACHE:-~/.cache/nim}:/opt/nim/.cache
    user: "${UID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - catalog-network

networks:
  catalog-network:
    external: true
    name: catalog-network

volumes:
  nim-cache:
    driver: local
